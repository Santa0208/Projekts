<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Panelis</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Patua+One&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='stils.css') }}"
    />
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </head>
  <body>
    <h1>Administrācijas panelis</h1>
    <br /><br />
    <a href="{{url_for('izlogoties')}}">Izlogoties</a>
    <div class="panelis">
      <h2>Respondentu atbildes</h2>
      <table border="1">
        <thead>
          <tr>
            <th>ID</th>
            <th>Vārds</th>
            <th>Dzimums</th>
            <th>Hobiji</th>
            <th>Darbība</th>
          </tr>
        </thead>
        <tbody>
          {% for lietotajs in lietotaji %}
          <tr>
            <td>{{ lietotajs[0] }}</td>
            <td>{{ lietotajs[1] }}</td>
            <td>{{ lietotajs[2] }}</td>
            <td>{{ lietotajs[3] }}</td>
            <td>
              <a
                href="{{ url_for('dzest_lietotaju', id=lietotajs[0]) }}"
                class="btn btn-danger btn-sn"
                >Dzēst</a
              >
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      <br /><br />
    </div>
    <a href="/aptauja">Atgriezties</a><br /><br />
  </body>
</html>
