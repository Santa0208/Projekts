<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Kontakti</title>
    <link rel="icon" type="image/x-icon" href="https://cdn.glitch.global/83edb286-2a81-4e4a-9075-0d4d4dad00f0/favicon.ico?v=1748422354942">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Patua+One&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='stils.css') }}"
    />
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </head>
  <body>
    <h1>Kontakti</h1>
    <div class="kontakti">
      <h4>Sazinies ar mums</h4>
      <p>E-pasts: info@mansprojekts.lv</p>
      <p>Telefons: +371 20000000</p>
      <p>Adrese: Brīvības iela 1, Rīga, Latvija</p>
    </div>
    <br /><br />
    <div class="raksti_mums">
      <div class="col-md-6">
        <h4>Raksti mums</h4>
        <form>
          <div class="mb-3">
            <label for="vards" class="form-label">Vārds</label>
            <input
              type="text"
              class="form-control"
              id="vards"
              placeholder="Tavs vārds"
              required
            />
          </div>
          <div class="mb-3">
            <label for="epasts" class="form-label">E-pasts</label>
            <input
              type="email"
              class="form-control"
              id="epasts"
              placeholder="tavs@email.com"
              required
            />
          </div>
          <div class="mb-3">
            <label for="zina" class="form-label">Ziņa</label>
            <textarea
              class="form-control"
              id="zina"
              rows="4"
              placeholder="Tava ziņa..."
              required
            ></textarea>
          </div>
          <button type="submit" class="btn btn-warning">Sūtīt</button>
        </form>
      </div>
    </div>
    <a href="/">Ej uz sākumu</a><br /><br />
    <a href="/">Atpakaļ</a>
  </body>
</html>
